<title>Kısayollar</title>
<style>
:root{--scale:1;--gl:.7;--sgl:.7;--bg:#000;--txt:#fff;--nav:rgba(28,28,30,.85);--card:#1c1c1e;--card-txt:#ebebf5;--sub:#8e8e93;--field:#2c2c2e;--kb:#3a3a3c;--kbtxt:#fff;--sep:rgba(255,255,255,.12);--seg-on:#636366;--tsh:0 1px 3px rgba(0,0,0,.5);--accent:#0a84ff}
html[data-theme="light"]{--bg:#f2f2f7;--txt:#000;--nav:rgba(246,246,248,.85);--card:#fff;--card-txt:#000;--sub:#6e6e73;--field:#e9e9ef;--kb:#fff;--kbtxt:#1d1d1f;--sep:rgba(0,0,0,.1);--seg-on:#fff;--accent:#007aff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
html{font-size:calc(16px*var(--scale))}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:var(--txt);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#wall{position:fixed;inset:0;background:#0b0f1e;transition:background .4s ease}
#app{position:fixed;inset:0;overflow:hidden}
#home{position:absolute;inset:0;padding:calc(env(safe-area-inset-top,0px) + 2.6rem) 1.1rem 6.5rem;transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#home::after,.screen::after{content:'';position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s}
#home.under{transform:translateX(-22%) scale(.97)}
#home.under::after{opacity:.35}
.head{display:flex;align-items:center;justify-content:space-between}
h1.title{font-size:2rem;font-weight:700;letter-spacing:-.02em;margin:0;text-shadow:0 1px 3px rgba(0,0,0,.25)}
.avatar{width:2.5rem;height:2.5rem;border-radius:50%;overflow:hidden;background:linear-gradient(160deg,#7C7EFF,#4A3BE0);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:1rem;color:#fff;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.avatar img{width:100%;height:100%;object-fit:cover}

/* Liquid glass kutu */
.glass{position:relative;margin-top:1.6rem;border-radius:2.2rem;padding:1.1rem .5rem 1.3rem;overflow:hidden;
  background:linear-gradient(145deg,rgba(255,255,255,calc(var(--gl)*.30)),rgba(255,255,255,calc(var(--gl)*.06)));
  -webkit-backdrop-filter:blur(calc(var(--gl)*26px)) saturate(calc(1 + var(--gl)*.8));
  backdrop-filter:blur(calc(var(--gl)*26px)) saturate(calc(1 + var(--gl)*.8));
  border:1px solid rgba(255,255,255,calc(var(--gl)*.35));
  box-shadow:inset 0 1px 1px rgba(255,255,255,calc(var(--gl)*.6)),0 calc(var(--gl)*12px) calc(var(--gl)*32px) rgba(0,0,0,calc(var(--gl)*.25))}
.glass::before{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,calc(var(--gl)*.2)) 0%,transparent 42%);pointer-events:none}
.grid{position:relative;display:grid;grid-template-columns:repeat(4,1fr);row-gap:1.5rem;column-gap:.2rem}
.tile{display:flex;flex-direction:column;align-items:center;gap:.45rem;cursor:pointer;touch-action:none;position:relative;transition:transform .2s}
.ic{width:4.3rem;height:4.3rem;border-radius:22.37%;position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--g1),var(--g2));box-shadow:0 .5rem 1rem rgba(0,0,0,.38),inset 0 0 0 .5px rgba(255,255,255,.3);overflow:hidden}
.ic::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0) 50%)}
.ic::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 -.12rem .3rem rgba(0,0,0,.18)}
.ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ic svg{width:2.7rem;height:2.7rem;position:relative;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.25))}
.lbl{font-size:.72rem;color:var(--txt);text-shadow:0 1px 3px rgba(0,0,0,.55);max-width:5.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.tile.drag{z-index:9;opacity:.92}
.tile.target .ic{box-shadow:0 0 0 .18rem rgba(255,255,255,.8)}
.tile.wig .ic{animation:wig .3s ease-in-out infinite alternate}
@keyframes wig{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}

/* Arama */
.sbar{position:fixed;left:1rem;right:1rem;bottom:calc(env(safe-area-inset-bottom,0px) + .8rem);z-index:20}
.sbar input{background:rgba(255,255,255,calc(var(--sgl)*.22));-webkit-backdrop-filter:blur(calc(var(--sgl)*22px)) saturate(calc(1 + var(--sgl)*.8));backdrop-filter:blur(calc(var(--sgl)*22px)) saturate(calc(1 + var(--sgl)*.8));border:1px solid rgba(255,255,255,calc(var(--sgl)*.3));box-shadow:0 .4rem 1.4rem rgba(0,0,0,calc(var(--sgl)*.25));color:var(--txt);border-radius:1.2rem;padding:.8rem 1rem}
.sbar input::placeholder{color:var(--sub)}
.res{position:fixed;left:1rem;right:1rem;bottom:calc(env(safe-area-inset-bottom,0px) + 4.6rem);max-height:52dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--card);border-radius:1rem;box-shadow:0 .5rem 2rem rgba(0,0,0,.3);z-index:20;display:none}
.res .empty{padding:.9rem;color:var(--sub);font-size:.85rem;text-align:center}

/* Ekranlar */
.screen{position:absolute;inset:0;background:var(--bg);color:var(--txt);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1);box-shadow:-.5rem 0 1.5rem rgba(0,0,0,.45);contain:layout paint;z-index:5}
.screen.in{transform:translateX(0)}
.screen.under{transform:translateX(-22%)}
.screen.under::after{opacity:.35}
.nav{flex:none;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + .6rem) .9rem .6rem;background:var(--nav);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:.5px solid var(--sep)}
.nav .ttl{font-size:1rem;font-weight:600}
.nav .back{background:none;border:none;color:var(--accent);font-size:1rem;padding:.4rem .2rem;min-width:4.5rem;text-align:left}
.nav .sp{min-width:4.5rem}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:.6rem 1rem calc(env(safe-area-inset-bottom,0px) + 2rem)}
.sec{font-size:.72rem;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;margin:.9rem .8rem .4rem}
.group{background:var(--card);border-radius:.9rem;overflow:hidden;margin-bottom:.4rem}
.row{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.7rem .9rem;border-top:.5px solid var(--sep)}
.row:first-child{border-top:none}
.d{font-size:.92rem;color:var(--card-txt);flex:1;min-width:0}
.d small{display:block;color:var(--sub);font-size:.75rem;margin-top:.1rem}
.kbs{display:flex;gap:.25rem;flex-wrap:wrap;justify-content:flex-end}
.kb{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.7rem;background:var(--kb);color:var(--kbtxt);border-radius:.4rem;padding:.2rem .42rem;white-space:nowrap;box-shadow:0 1px 0 #000}
.tip{background:var(--card);border-radius:.9rem;padding:.8rem .9rem;font-size:.85rem;line-height:1.45;color:var(--card-txt);margin-top:.6rem}
.tip b{color:#ffd60a}
input{width:100%;background:var(--field);border:none;border-radius:.6rem;padding:.7rem .8rem;color:var(--txt);font-size:1rem;outline:none;font-family:inherit}
input::placeholder{color:var(--sub)}
input[type=range]{accent-color:var(--accent);background:none;padding:.3rem 0}
.pad{padding:.7rem;display:flex;flex-direction:column;gap:.5rem}
.lab{display:flex;justify-content:space-between;color:var(--card-txt);font-size:.92rem}
.lab b{font-weight:600;color:var(--sub)}
.btn{display:block;width:100%;background:var(--accent);border:none;color:#fff;border-radius:.7rem;padding:.7rem 1rem;font-size:1rem;font-weight:600;text-align:center;font-family:inherit}
.btn.ghost{background:var(--field);color:var(--txt)}
.btn.danger{background:#ff453a}
.small-del{background:none;border:none;color:#ff453a;font-size:.85rem;padding:.3rem;font-family:inherit}
.seg{display:flex;background:var(--field);border-radius:.6rem;padding:.2rem}
.seg button{flex:1;background:none;border:none;color:var(--txt);padding:.5rem 0;border-radius:.45rem;font-size:.9rem;font-family:inherit}
.seg button.on{background:var(--seg-on)}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem}
.sw{aspect-ratio:9/16;border-radius:.6rem;border:2px solid transparent}
.sw.on{border-color:var(--txt)}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:.5rem}
.pal div{aspect-ratio:1;border-radius:50%;border:2px solid transparent}
.pal div.on{border-color:var(--txt)}
.dev{text-align:center;gap:.2rem;padding:1rem}
.dev b{font-size:1rem}
.dev span{color:var(--sub);font-size:.8rem}
.note{font-size:.75rem;color:var(--sub);text-align:center;margin-top:.8rem}
</style>
</head>

<div id="app">
  <section id="home">
    <div class="head">
      <h1 class="title">Kısayollar</h1>

<div class="res" id="res"></div>
<div class="sbar"><input id="q" type="search" placeholder="Kısayol ara veya sor (örn. kopyala)" autocomplete="off" enterkeyhint="search"></div>

/* Durum: tüm değişiklikler kaydedilir */
function load(){
  let s = {};
  try { s = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){}
  const st = Object.assign({name:'', avatar:'', wall:0, img:'', scale:'m', theme:'sys', icons:{}, order:DEFAULT_ORDER.slice(), extras:[], apps:[], glass:70, sglass:70}, s);
  if(!Array.isArray(st.apps)) st.apps = [];
  if(!Array.isArray(st.extras)) st.extras = [];
  const all = [...DEFAULT_ORDER, ...st.apps.map(a => a.id)];
  const order = st.order.filter(id => all.includes(id));
  all.forEach(id => { if(!order.includes(id)) order.push(id); });
  st.order = order;
  return st;
}
let state = load();
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ alert('Kayıt alanı dolu. Daha küçük bir fotoğraf seçmeyi dene.'); }
}
function esc(t){ return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function kbs(keys){
  return '<span class="kbs">' + keys.split(' ').filter(Boolean).map(k => `<span class="kb">${esc(k)}</span>`).join('') + '</span>';
}
function rowsHTML(items){
  return '<div class="group">' + items.map(([k,d]) => `<div class="row"><span class="d">${esc(d)}</span>${kbs(k)}</div>`).join('') + '</div>';
}

const grid = $('#grid'), wall = $('#wall'), home = $('#home'), res = $('#res'), q = $('#q'), av = $('#avatar');
const stack = [];

function curWalls(){ return document.documentElement.dataset.theme === 'light' ? WALLS_LIGHT : WALLS_DARK; }
function applyVars(){
  const r = document.documentElement.style;
  r.setProperty('--scale', SCALES[state.scale] || 1);
  r.setProperty('--gl', state.glass / 100);
  r.setProperty('--sgl', state.sglass / 100);
}
function applySettings(){
  const pref = state.theme || 'sys';
  const dark = pref === 'sys' ? matchMedia('(prefers-color-scheme: dark)').matches : pref === 'dark';
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  wall.style.background = state.img ? `url("${state.img}") center/cover no-repeat` : (curWalls()[state.wall] || curWalls()[0]);
  av.innerHTML = state.avatar ? `<img src="${state.avatar}" alt="">` : `<span>${esc((state.name || 'K').trim().charAt(0).toUpperCase())}</span>`;
  applyVars();
}

function metaOf(id){
  if(META[id]) return META[id];
  const a = state.apps.find(x => x.id === id);
  if(!a) return null;
  return {name:a.name, g:PALETTE[a.color % PALETTE.length], svg:STAR};
}
function iconHTML(id){
  const m = metaOf(id);
  const a = state.apps.find(x => x.id === id);
  const pic = state.icons[id] || (a && a.icon);
  if(pic) return `<div class="ic"><img src="${pic}" alt=""></div>`;
  return `<div class="ic" style="--g1:${m.g[0]};--g2:${m.g[1]}"><svg viewBox="0 0 24 24" fill="none">${m.svg}</svg></div>`;
}
function renderHome(){
  grid.innerHTML = '';
  state.order.forEach(id => {
    const m = metaOf(id); if(!m) return;
    const t = document.createElement('div');
    t.className = 'tile'; t.dataset.id = id;
    t.innerHTML = iconHTML(id) + `<div class="lbl">${esc(m.name)}</div>`;
    grid.appendChild(t);
  });
}

/* Ekran yığını: itme geçişi, örtüşen katmanlar, kenardan geri kaydırma */
function updateUnder(){
  stack.forEach((s,i) => {
    const top = i === stack.length - 1;
    s.classList.toggle('in', top);
    s.classList.toggle('under', !top);
  });
  home.classList.toggle('under', stack.length > 0);
  document.querySelector('.sbar').style.display = stack.length ? 'none' : '';
  if(stack.length) res.style.display = 'none';
}
function push(title, build){
  const el = document.createElement('section');
  el.className = 'screen';
  el.innerHTML = `<div class="nav"><button class="back">‹ Geri</button><div class="ttl">${esc(title)}</div><span class="sp"></span></div><div class="body"></div>`;
  el.querySelector('.back').onclick = pop;
  $('#app').appendChild(el);
  stack.push(el);
  build(el.querySelector('.body'));
  attachSwipe(el);
  requestAnimationFrame(() => requestAnimationFrame(updateUnder));
}
function pop(){
  const el = stack.pop(); if(!el) return;
  el.classList.remove('in','under');
  setTimeout(() => el.remove(), 480);
  updateUnder();
}
function attachSwipe(el){
  let sx = null, dx = 0;
  el.addEventListener('pointerdown', e => {
    if(e.clientX > 28 || stack[stack.length-1] !== el) return;
    sx = e.clientX; el.setPointerCapture(e.pointerId); el.style.transition = 'none';
  });
  el.addEventListener('pointermove', e => {
    if(sx === null) return;
    dx = Math.max(0, e.clientX - sx);
    el.style.transform = `translateX(${dx}px)`;
  });
  const end = () => {
    if(sx === null) return;
    sx = null; el.style.transition = ''; el.style.transform = '';
    if(dx > 90) pop();
    dx = 0;
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

/* Ekranlar */
function openSection(id){
  if(id === 'ekstra') return push('Ekstra Kısayollar', renderExtras);
  if(id === 'ayarlar') return push('Ayarlar', renderSettings);
  if(SECTIONS[id]){
    const s = SECTIONS[id];
    return push(s.name, b => { b.innerHTML = rowsHTML(s.items) + (s.tip ? `<div class="tip"><b>İpucu:</b> ${esc(s.tip)}</div>` : ''); });
  }
  const a = state.apps.find(x => x.id === id);
  if(a) push(a.name, b => renderApp(b, a));
}
function renderExtras(body){
  const list = state.extras.length
    ? '<div class="group">' + state.extras.map((x,i) =>
        `<div class="row"><span class="d">${esc(x.name)}${x.desc ? `<small>${esc(x.desc)}</small>` : ''}</span>${kbs(x.keys)}<button class="small-del" data-del="${i}">Sil</button></div>`).join('') + '</div>'
    : '<div class="group"><div class="row"><span class="d" style="color:var(--sub)">Henüz ekstra kısayol yok</span></div></div>';
  body.innerHTML = `
    <div class="sec">Yeni kısayol</div>
    <div class="group pad">
      <input id="xn" placeholder="Ne yapar? (örn. Ekran kilidi)" maxlength="40">
      <input id="xk" placeholder="Tuşlar (örn. ⌘ ⇧ K)" maxlength="30">
      <input id="xd" placeholder="Açıklama (isteğe bağlı)" maxlength="60">
      <button class="btn" id="xadd">Ekle</button>
    </div>
    <div class="sec">Eklediklerin</div>${list}`;
  body.querySelector('#xadd').onclick = () => {
    const name = body.querySelector('#xn').value.trim();
    const keys = body.querySelector('#xk').value.trim();
    const desc = body.querySelector('#xd').value.trim();
    if(!name || !keys) return alert('Ad ve tuş alanları zorunlu.');
    state.extras.push({name, keys, desc}); save(); renderExtras(body);
  };
  body.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    state.extras.splice(+b.dataset.del, 1); save(); renderExtras(body);
  });
}
function renderApp(body, a){
  const rows = a.items.length
    ? '<div class="group">' + a.items.map((x,i) => `<div class="row"><span class="d">${esc(x.desc || '—')}</span>${kbs(x.keys)}<button class="small-del" data-d="${i}">Sil</button></div>`).join('') + '</div>'
    : '<div class="group"><div class="row"><span class="d" style="color:var(--sub)">Henüz kısayol yok</span></div></div>';
  body.innerHTML = `
    <div class="sec">Yeni kısayol</div>
    <div class="group pad">
      <input id="ak" placeholder="Tuşlar (örn. ⌘ ⇧ K)" maxlength="30">
      <input id="ad" placeholder="Ne yapar?" maxlength="60">
      <button class="btn" id="aadd">Ekle</button>
    </div>
    <div class="sec">Kısayollar</div>${rows}
    <div class="sec">Kutucuk</div>
    <div class="group pad"><button class="btn danger" id="adel">Bu kutucuğu sil</button></div>`;
  body.querySelector('#aadd').onclick = () => {
    const k = body.querySelector('#ak').value.trim(), d = body.querySelector('#ad').value.trim();
    if(!k) return alert('Tuş alanı zorunlu.');
    a.items.push({keys:k, desc:d}); save(); renderApp(body, a);
  };
  body.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
    a.items.splice(+b.dataset.d, 1); save(); renderApp(body, a);
  });
  body.querySelector('#adel').onclick = () => {
    if(!confirm('Kutucuk silinsin mi?')) return;
    deleteApp(a.id); pop();
  };
}
function deleteApp(id){
  state.apps = state.apps.filter(x => x.id !== id);
  state.order = state.order.filter(x => x !== id);
  save(); renderHome();
}

/* Fotoğraf yardımcıları */
function readImage(file, cb){
  const r = new FileReader();
  r.onload = () => { const img = new Image(); img.onload = () => cb(img); img.src = r.result; };
  r.readAsDataURL(file);
}
function compressWall(file, cb){
  readImage(file, img => {
    const k = Math.min(1, 1080 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    cb(c.toDataURL('image/jpeg', .8));
  });
}
function compressSquare(file, cb){
  readImage(file, img => {
    const c = document.createElement('canvas'); c.width = 256; c.height = 256;
    const s = Math.min(img.width, img.height);
    c.getContext('2d').drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, 256, 256);
    cb(c.toDataURL('image/png'));
  });
}
function setIcon(id, data){
  const a = state.apps.find(x => x.id === id);
  if(a) a.icon = data; else state.icons[id] = data;
}
function resetIcon(id){
  const a = state.apps.find(x => x.id === id);
  if(a) delete a.icon; else delete state.icons[id];
}
function hasIcon(id){
  const a = state.apps.find(x => x.id === id);
  return !!(a ? a.icon : state.icons[id]);
}

/* Ayarlar */
let draft = {name:'', color:0, icon:''};
function themeHTML(){
  const cur = state.theme || 'sys';
  return `<div class="sec">Tema</div><div class="group pad"><div class="seg">${[['sys','Sistem'],['light','Açık'],['dark','Koyu']].map(([k,l]) =>
    `<button data-th="${k}" class="${cur===k ? 'on' : ''}">${l}</button>`).join('')}</div></div>`;
}
function iconRowsHTML(){
  return '<div class="group">' + state.order.map(id => {
    const m = metaOf(id);
    return `<div class="row"><span class="d">${esc(m.name)}</span>${hasIcon(id) ? `<button class="small-del" data-iconreset="${id}">Sıfırla</button>` : ''}<label class="small-del" style="color:var(--accent);cursor:pointer">Değiştir<input type="file" accept="image/*" data-icon="${id}" hidden></label></div>`;
  }).join('') + '</div>';
}
function appListHTML(){
  if(!state.apps.length) return '<div class="group"><div class="row"><span class="d" style="color:var(--sub)">Henüz kendi kutucuğun yok</span></div></div>';
  return '<div class="group">' + state.apps.map(a =>
    `<div class="row"><span class="d">${esc(a.name)}</span><button class="small-del" data-delapp="${a.id}">Sil</button></div>`).join('') + '</div>';
}
function renderSettings(body){
  body.innerHTML = `
    <div class="sec">Profil</div>
    <div class="group pad">
      <input id="nm" placeholder="Kullanıcı adın" value="${esc(state.name)}" maxlength="24">
      <label class="btn ghost">Profil fotoğrafı seç<input type="file" id="avf" accept="image/*" hidden></label>
      ${state.avatar ? '<button class="btn ghost" id="avr">Profil fotoğrafını kaldır</button>' : ''}
    </div>
    ${themeHTML()}
    <div class="sec">Arka plan</div>
    <div class="group pad">
      <div class="swatches">${curWalls().map((w,i) => `<div class="sw ${!state.img && state.wall===i ? 'on' : ''}" data-w="${i}" style="background:${w}"></div>`).join('')}</div>
      <label class="btn ghost">Kendi fotoğrafını seç<input type="file" id="pic" accept="image/*" hidden></label>
    </div>
    <div class="sec">Şeffaflık</div>
    <div class="group pad">
      <div class="lab"><span>Ana kutu opaklığı</span><b id="gv">${state.glass}%</b></div>
      <input type="range" id="gl" min="0" max="100" value="${state.glass}">
      <div class="lab"><span>Arama kutusu opaklığı</span><b id="sv">${state.sglass}%</b></div>
      <input type="range" id="sgl" min="0" max="100" value="${state.sglass}">
      <p class="note" style="margin:0">0 yaparsan kutu tamamen kalkar.</p>
    </div>
    <div class="sec">Yazı boyutu</div>
    <div class="group pad"><div class="seg">${Object.keys(SCALES).map(k =>
      `<button data-sc="${k}" class="${state.scale===k ? 'on' : ''}">${k.toUpperCase()}</button>`).join('')}</div></div>
    <div class="sec">Yeni kutucuk ekle</div>
    <div class="group pad">
      <input id="cn" placeholder="Kutucuk adı" maxlength="18" value="${esc(draft.name)}">
      <div class="pal">${PALETTE.map((p,i) => `<div data-pal="${i}" class="${draft.color===i ? 'on' : ''}" style="background:linear-gradient(160deg,${p[0]},${p[1]})"></div>`).join('')}</div>
      <label class="btn ghost">${draft.icon ? 'Fotoğraf seçildi ✓' : 'Fotoğraf ekle (isteğe bağlı)'}<input type="file" id="cpic" accept="image/*" hidden></label>
      <button class="btn" id="cadd">Ana ekrana ekle</button>
    </div>
    ${appListHTML()}
    <div class="sec">Simgeler</div>${iconRowsHTML()}
    <div class="sec">Sıfırla</div>
    <div class="group pad"><button class="btn danger" id="rst">Tüm ayarları ve kısayolları sıfırla</button></div>
    <div class="sec">Geliştirici</div>
    <div class="group dev pad"><b>Onur Bekir Çalgın</b><span>Claude ile geliştirilmiştir</span></div>`;

  body.querySelector('#nm').oninput = e => { state.name = e.target.value.trim(); save(); applySettings(); };
  const avf = body.querySelector('#avf');
  avf.onchange = e => { const f = e.target.files[0]; if(!f) return;
    compressSquare(f, data => { state.avatar = data; save(); applySettings(); renderSettings(body); }); };
  const avr = body.querySelector('#avr');
  if(avr) avr.onclick = () => { state.avatar = ''; save(); applySettings(); renderSettings(body); };

  body.querySelectorAll('[data-th]').forEach(b => b.onclick = () => { state.theme = b.dataset.th; save(); applySettings(); renderSettings(body); });
  body.querySelectorAll('[data-w]').forEach(s => s.onclick = () => { state.wall = +s.dataset.w; state.img = ''; save(); applySettings(); renderSettings(body); });
  body.querySelector('#pic').onchange = e => { const f = e.target.files[0]; if(!f) return;
    compressWall(f, data => { state.img = data; save(); applySettings(); renderSettings(body); }); };

  body.querySelector('#gl').oninput = e => { state.glass = +e.target.value; body.querySelector('#gv').textContent = state.glass + '%'; save(); applyVars(); };
  body.querySelector('#sgl').oninput = e => { state.sglass = +e.target.value; body.querySelector('#sv').textContent = state.sglass + '%'; save(); applyVars(); };
  body.querySelectorAll('[data-sc]').forEach(b => b.onclick = () => { state.scale = b.dataset.sc; save(); applyVars(); renderSettings(body); });

  body.querySelector('#cn').oninput = e => { draft.name = e.target.value; };
  body.querySelectorAll('[data-pal]').forEach(p => p.onclick = () => { draft.color = +p.dataset.pal; renderSettings(body); });
  body.querySelector('#cpic').onchange = e => { const f = e.target.files[0]; if(!f) return;
    compressSquare(f, data => { draft.icon = data; renderSettings(body); }); };
  body.querySelector('#cadd').onclick = () => {

    draft = {name:'', color:0, icon:''};
    save(); renderHome(); renderSettings(body);
  };
  body.querySelectorAll('[data-delapp]').forEach(b => b.onclick = () => {
    if(!confirm('Bu kutucuk silinsin mi?')) return;
    deleteApp(b.dataset.delapp); renderSettings(body);
  });

  body.querySelectorAll('[data-icon]').forEach(inp => inp.onchange = e => {
    const f = e.target.files[0]; if(!f) return;

  });

    if(!confirm('Tüm kayıtlar silinsin mi?')) return;
    localStorage.removeItem(KEY); location.reload();
  };
}
av.onclick = () => push('Ayarlar', renderSettings);

/* Ana ekran: dokunma ve sürükle-bırak */
let pressT = null, dragEl = null, target = null, sx0 = 0, sy0 = 0, suppress = false;
function nearest(x, y){
  let best = null, bd = 1e9;
  grid.querySelectorAll('.tile').forEach(t => {
    if(t === dragEl) return;
    const r = t.getBoundingClientRect();
    const d = Math.hypot(x - (r.left + r.width/2), y - (r.top + r.height/2));
    if(d < bd){ bd = d; best = t; }
  });
  return bd < 52 ? best : null;
}
grid.addEventListener('pointerdown', e => {
  const t = e.target.closest('.tile'); if(!t) return;
  suppress = false; sx0 = e.clientX; sy0 = e.clientY;
  clearTimeout(pressT);
  pressT = setTimeout(() => {
    dragEl = t; t.classList.add('drag');
    grid.querySelectorAll('.tile').forEach(x => x.classList.add('wig'));
    try { grid.setPointerCapture(e.pointerId); } catch(_){}
  }, 350);
});
grid.addEventListener('pointermove', e => {
  if(!dragEl){
    if(Math.hypot(e.clientX - sx0, e.clientY - sy0) > 10){ clearTimeout(pressT); pressT = null; }
    return;
  }
  dragEl.style.transform = `translate(${e.clientX - sx0}px, ${e.clientY - sy0}px) scale(1.08)`;
  const nt = nearest(e.clientX, e.clientY);
  if(target && target !== nt) target.classList.remove('target');
  target = nt;
  if(nt) nt.classList.add('target');
});
const endDrag = () => {
  clearTimeout(pressT); pressT = null;
  if(!dragEl) return;
  if(target){
    const id = dragEl.dataset.id, tid = target.dataset.id;
    state.order.splice(state.order.indexOf(id), 1);
    state.order.splice(state.order.indexOf(tid), 0, id);
    save();
  }
  dragEl = null; target = null; suppress = true;
  renderHome();
};
grid.addEventListener('pointerup', endDrag);
grid.addEventListener('pointercancel', endDrag);
grid.addEventListener('click', e => {
  if(suppress){ suppress = false; return; }
  const t = e.target.closest('.tile');
  if(t) openSection(t.dataset.id);
});

/* Arama ve yerel asistan (dış servis kullanmaz) */
function allItems(){
  const list = [];
  Object.values(SECTIONS).forEach(s => s.items.forEach(([k,d]) => list.push({k, d, src: s.name})));
  state.extras.forEach(x => list.push({k: x.keys, d: x.name + (x.desc ? ' ' + x.desc : ''), src: 'Ekstra'}));
  state.apps.forEach(a => a.items.forEach(x => list.push({k: x.keys, d: x.desc || a.name, src: a.name})));
  return list;
}
function answer(text){
  const words = text.toLowerCase().split(/\s+/).filter(Boolean);
  const aliasKeys = Object.keys(ALIAS).filter(a => words.some(w => w.startsWith(a)));
  const hits = [];
  allItems().forEach(it => {
    const hay = (it.d + ' ' + it.k + ' ' + it.src).toLowerCase();
    let score = 0;
    words.forEach(w => { if(hay.includes(w)) score += 2; });
    aliasKeys.forEach(a => { if(it.k.includes(ALIAS[a])) score += 3; });
    if(score > 0) hits.push({...it, score});
  });
  return hits.sort((a,b) => b.score - a.score).slice(0, 12);
}
q.addEventListener('input', () => {
  const v = q.value.trim();
  if(!v){ res.style.display = 'none'; return; }
  const hits = answer(v);
  res.style.display = 'block';
  res.innerHTML = hits.length
    ? '<div class="group" style="margin:0;border-radius:1rem">' + hits.map(h =>
        `<div class="row"><span class="d">${esc(h.d)}<small>${esc(h.src)}</small></span>${kbs(h.k)}</div>`).join('') + '</div>'
    : '<div class="empty">Eşleşme yok. "kopyala", "ekran", "sekme" gibi kısa kelimeler dene.</div>';
});
q.addEventListener('keydown', e => { if(e.key === 'Enter') q.blur(); });

/* Başlangıç */
applySettings();
renderHome();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if((state.theme || 'sys') === 'sys') applySettings(); });
</script>
