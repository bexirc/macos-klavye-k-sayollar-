<title>Kısayollar</title>
<style>
:root{--scale:1;--ff:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;--bw:400;--gl:.7;--sgl:.7;--bg:#000;--txt:#fff;--card:#1c1c1e;--card-txt:#fff;--sub:#8e8e93;--field:#2c2c2e;--kb:#3a3a3c;--kbtxt:#fff;--sep:rgba(84,84,88,.65);--seg-on:#636366;--accent:#0a84ff;--tsh:0 1px 3px rgba(0,0,0,.55)}
html[data-theme="light"]{--bg:#F2F2F7;--txt:#000;--card:#fff;--card-txt:#000;--sub:#8e8e93;--field:#E9E9EF;--kb:#fff;--kbtxt:#1d1d1f;--sep:rgba(60,60,67,.29);--seg-on:#fff;--accent:#007aff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
html{font-size:calc(16px*var(--scale))}
body{font-family:var(--ff);font-weight:var(--bw);color:var(--txt);background:var(--bg);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#wall{position:fixed;inset:0;background:var(--bg)}
#app{position:fixed;inset:0;overflow:hidden}

/* Ana ekran */
#home{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 1rem calc(env(safe-area-inset-bottom,0px) + 6rem);z-index:1;transition:transform calc(.5s * var(--ad,1.25)) cubic-bezier(.32,.72,0,1);will-change:transform}
#home.under{transform:translateX(-22%) scale(.97)}
#home::after,.screen::after{content:'';position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity calc(.5s * var(--ad,1.25)) ease}
#home.under::after{opacity:.35}
.nav{position:sticky;top:0;z-index:4;height:calc(env(safe-area-inset-top,0px) + 3.4rem);padding:env(safe-area-inset-top,0px) 1rem 0;margin:0 -1rem;display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-bottom:.5px solid var(--sep)}
.nav .ntitle{position:absolute;left:0;right:0;top:calc(50% + env(safe-area-inset-top,0px)/2);transform:translateY(-50%);text-align:center;margin:0;font-size:1.0625rem;font-weight:calc(var(--bw) + 100);pointer-events:none}
.pill{position:relative;z-index:1;height:2.6rem;padding:0 1.1rem;border-radius:999px;border:.5px solid var(--sep);background:var(--card);color:var(--txt);font-size:1.0625rem;font-weight:calc(var(--bw) + 100);font-family:inherit;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.circ{position:relative;z-index:1;width:2.6rem;height:2.6rem;border-radius:50%;border:.5px solid var(--sep);background:var(--card);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.28rem;padding:0;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.circ i{display:block;width:1.2rem;height:2.4px;border-radius:2px;background:var(--txt)}
.glass{position:relative;margin-top:1.6rem;border-radius:2.2rem;padding:1.1rem .5rem 1.3rem;overflow:hidden;
  background:linear-gradient(145deg,rgba(255,255,255,calc(var(--gl)*.30)),rgba(255,255,255,calc(var(--gl)*.06)));
  -webkit-backdrop-filter:blur(calc(var(--gl)*26px)) saturate(calc(1 + var(--gl)*.8));
  backdrop-filter:blur(calc(var(--gl)*26px)) saturate(calc(1 + var(--gl)*.8));
  border:1px solid rgba(255,255,255,calc(var(--gl)*.35));
  box-shadow:inset 0 1px 1px rgba(255,255,255,calc(var(--gl)*.6)),0 calc(var(--gl)*12px) calc(var(--gl)*32px) rgba(0,0,0,calc(var(--gl)*.25))}
.glass::before{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,calc(var(--gl)*.2)) 0%,transparent 42%);pointer-events:none}
.grid{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));row-gap:1.5rem;column-gap:.2rem}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:.45rem;min-width:0;width:100%;cursor:pointer;touch-action:pan-y;transition:transform calc(.2s * var(--ad,1.25))}
.editing .tile{touch-action:none}
.ic{width:min(4.3rem,100%);aspect-ratio:1;height:auto;border-radius:22.37%;position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--g1),var(--g2));box-shadow:0 .5rem 1rem rgba(0,0,0,.38);overflow:hidden}
.ic::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%)}
.ic::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 -.12rem .3rem rgba(0,0,0,.18)}
.ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ic svg{width:58%;height:58%;position:relative;filter:drop-shadow(0 1px 2px rgba(0,0,0,.28))}
.lbl{font-size:.75rem;color:var(--txt);text-shadow:var(--tsh);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.tile.drag{z-index:9;opacity:.92}
.tile.target .ic{box-shadow:0 0 0 .18rem rgba(255,255,255,.8)}
.editing .tile .ic{animation:wig calc(.3s * var(--ad,1.25)) ease-in-out infinite alternate}

const PAL50 = (() => {
  const out = [];
  const hsl = (h,s,l) => {
    s/=100; l/=100;
    const a = s*Math.min(l,1-l);
    const f = n => { const k=(n+h/30)%12; return l - a*Math.max(-1, Math.min(k-3, 9-k, 1)); };
    const hex = x => Math.round(x*255).toString(16).padStart(2,'0');
    return '#' + hex(f(0)) + hex(f(8)) + hex(f(4));
  };
  for(let i=0;i<10;i++){
    const h = i*36;
    for(const L of [70,60,50,40,30]) out.push([hsl(h,85,Math.min(L+8,88)), hsl(h,85,L)]);
  }
  return out;
})();

function colorGridHTML(cur){
  return '<div class="cgrid">' + PAL50.map((p,i) => `<button class="cbtn${i===cur?' on':''}" data-c="${i}" style="background:linear-gradient(160deg,${p[0]},${p[1]})" aria-label="Renk ${i+1}"></button>`).join('') + '</div>';
}
function glyphGridHTML(cur){
  return '<div class="ggrid">' + GLYPHS.map((g,i) => `<button class="gbtn${i===cur?' on':''}" data-g="${i}" aria-label="${esc(g[0])}"><svg viewBox="0 0 24 24" fill="#fff">${g[1]}</svg></button>`).join('') + '</div>';
}
function bindPick(body, sel, key, fn){
  body.querySelectorAll(sel).forEach(b => b.onclick = () => fn(+b.dataset[key]));
}

/* Simge düzenleme ekranı (renk, simge, fotoğraf, ad) */
function renderDesigner(body, id){
  const a = state.apps.find(x => x.id === id);
  const m = metaOf(id);
  const cur = a ? a.color : (state.colors[id] != null ? state.colors[id] : -1);
  body.innerHTML = `
    <div class="prevwrap"><div class="tile-prev">${iconHTML(id)}<div class="lbl" id="plbl">${esc(m.name)}</div></div></div>
    ${a ? `<div class="sec">Ad</div><div class="group pad"><input id="dn" value="${esc(a.name)}" maxlength="18"></div>` : ''}
    <div class="sec">Renk</div>
    <div class="group pad">${colorGridHTML(cur)}</div>
    ${a ? `<div class="sec">Simge</div><div class="group pad">${glyphGridHTML(a.glyph || 0)}</div>` : ''}
    <div class="sec">Fotoğraf</div>
    <div class="group pad"><label class="btn ghost">Fotoğraf seç<input type="file" id="dp" accept="image/*" hidden></label>${hasIcon(id) ? '<button class="btn ghost" id="dpr">Fotoğrafı kaldır</button>' : ''}</div>
    ${!a && state.colors[id] != null ? '<div class="sec">Varsayılan</div><div class="group pad"><button class="btn ghost" id="drc">Varsayılan rengi geri yükle</button></div>' : ''}`;

  const dn = body.querySelector('#dn');
  if(dn) dn.oninput = e => {
    const v = e.target.value.trim();
    if(!v) return;
    a.name = v; save(); body.querySelector('#plbl').textContent = v; renderHome();
  };
  bindPick(body, '[data-c]', 'c', i => {
    if(a) a.color = i; else state.colors[id] = i;
    save(); renderHome(); renderDesigner(body, id);
  });
  bindPick(body, '[data-g]', 'g', i => {
    if(a){ a.glyph = i; save(); renderHome(); renderDesigner(body, id); }
  });
  body.querySelector('#dp').onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    compressSquare(f, data => { setIcon(id, data); save(); renderHome(); renderDesigner(body, id); });
  };
  const dpr = body.querySelector('#dpr');
  if(dpr) dpr.onclick = () => { resetIcon(id); save(); renderHome(); renderDesigner(body, id); };
  const drc = body.querySelector('#drc');
  if(drc) drc.onclick = () => { delete state.colors[id]; save(); renderHome(); renderDesigner(body, id); };
}

const glassEl = $('.glass');
function fitGlass(){
  document.querySelectorAll('#home .glass').forEach(glassEl => {
    if(document.body.classList.contains('iosm')){ glassEl.style.setProperty('--gs', 1); glassEl.style.marginBottom = ''; return; }
    if(!document.body.classList.contains('editing')){
      glassEl.style.setProperty('--gs', 1);
      glassEl.style.marginBottom = '';
      return;
    }
    const gh = glassEl.offsetHeight, top = glassEl.offsetTop;
    const panelH = $('#qpanel').offsetHeight;
    const avail = window.innerHeight - panelH - top - 84;
    const gs = Math.max(.55, Math.min(1, avail / gh));
    glassEl.style.setProperty('--gs', gs.toFixed(3));
    glassEl.style.marginBottom = `${Math.round((gs - 1) * gh)}px`;
  });
}

/* 30 arka plan rengi ve renk yardımcıları */
const BG30 = ['#F2F2F7','#E5E5EA','#D1D1D6','#C7C7CC','#AEAEB2','#8E8E93','#636366','#48484A',
  '#000000','#1C1C1E','#2C2C2E','#3A3A3C',
  '#FFE5EC','#FFF0D9','#FFF9D6','#E3F7E1','#DDF3F7','#E0EBFF','#EEE3FF','#FFE3F3',
  '#1F3A5F','#0E3B43','#1E4D2B','#4A1D3D','#5C2A1E','#3B2F63','#7A1F2B','#B45309','#155E75','#581C87'];
function hexToRgb(h){ h = h.replace('#',''); return [0,2,4].map(i => parseInt(h.substr(i,2),16)); }
function rgbToHex(c){ return '#' + c.map(v => Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join(''); }
function mix(a,b,t){ const A = hexToRgb(a), B = hexToRgb(b); return rgbToHex(A.map((v,i) => v + (B[i]-v)*t)); }
function lum(hex){
  const c = hexToRgb(hex).map(v => { v /= 255; return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); });
  return 0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2];
}
function isDarkBg(hex){
  const L = lum(hex);
  return (1.05/(L+0.05)) > ((L+0.05)/0.05);   /* beyaz yazı, siyah yazıdan daha okunaklıysa koyu zemin */
}
const ROOT_STYLE = document.documentElement.style;
const COLOR_VARS = ['--bg','--nav','--txt','--card-txt','--kbtxt','--sub','--card','--field','--kb','--seg-on','--sep','--tsh'];
function applyColors(){
  if(!state.bgc){ COLOR_VARS.forEach(v => ROOT_STYLE.removeProperty(v)); return; }
  const bg = state.bgc, dark = isDarkBg(bg);
  const txt = dark ? '#ffffff' : '#000000';
  ROOT_STYLE.setProperty('--bg', bg);
  ROOT_STYLE.setProperty('--nav', bg);
  ROOT_STYLE.setProperty('--txt', txt);
  ROOT_STYLE.setProperty('--card-txt', txt);
  ROOT_STYLE.setProperty('--kbtxt', txt);
  ROOT_STYLE.setProperty('--sub', dark ? mix(bg,'#ffffff',.6) : mix(bg,'#000000',.5));
  ROOT_STYLE.setProperty('--card', dark ? mix(bg,'#ffffff',.08) : mix(bg,'#ffffff',.75));
  ROOT_STYLE.setProperty('--field', dark ? mix(bg,'#ffffff',.16) : mix(bg,'#000000',.07));
  ROOT_STYLE.setProperty('--kb', dark ? mix(bg,'#ffffff',.24) : '#ffffff');
  ROOT_STYLE.setProperty('--seg-on', dark ? mix(bg,'#ffffff',.3) : '#ffffff');
  ROOT_STYLE.setProperty('--sep', dark ? 'rgba(255,255,255,.14)' : 'rgba(0,0,0,.12)');
  ROOT_STYLE.setProperty('--tsh', dark ? '0 1px 3px rgba(0,0,0,.55)' : '0 1px 2px rgba(255,255,255,.45)');
}

/* Durum: her değişiklik kaydedilir */
function load(){
  let s = {};
  try { s = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){}
  if(s.ff && !['sys','arial'].includes(s.ff)) s.ff = 'sys';
  const st = Object.assign({name:'', avatar:'', wall:0, img:'', scale:'m', theme:'sys', icons:{}, order:DEFAULT_ORDER.slice(), extras:[], apps:[], notes:[], pages:null, dock:null, itrOn:false, iosLook:true, dockOn:true, dockCustom:false, dockFx:true, sbStyle:'normal', dockSlot:{}, colors:{}, ff:'sys', fw:2, shadow:50, isp:50, anim:50, rr:50, itr:50, glass:50, sglass:50, fx:true}, s);
  if(!Array.isArray(st.apps)) st.apps = [];
  if(!Array.isArray(st.extras)) st.extras = [];
  if(!Array.isArray(st.notes)) st.notes = [];
  if(!st.cleanV4){
    st.apps = st.apps.filter(a => !/^\s*(selam|m\s*hatfli)\s*$/i.test(a.name || ''));
    st.notes = st.notes.filter(n => !/deneme/i.test((n.title || '') + ' ' + (n.body || '')));
    st.cleanV4 = true;
  }
  if(!st.cleanV5){
    st.apps = st.apps.filter(a => !/^\s*m\s*$/i.test(a.name || ''));
    st.cleanV5 = true;
  }
  const all = [...DEFAULT_ORDER, ...st.apps.map(a => a.id)];
  if(!Array.isArray(st.pages) || !st.pages.length){
    st.dock = DEFAULT_DOCK.slice();
    st.pages = [(st.order || DEFAULT_ORDER).filter(id => all.includes(id) && !st.dock.includes(id))];
  }
  const seen = new Set();
  const dockAll = (Array.isArray(st.dock) ? st.dock : []).filter(id => all.includes(id) && !seen.has(id) && seen.add(id));
  st.dock = dockAll.slice(0, 4);
  const overflow = dockAll.slice(4);
  st.pages = st.pages.map(pg => (Array.isArray(pg) ? pg : []).filter(id => all.includes(id) && !seen.has(id) && seen.add(id)));
  overflow.forEach(id => st.pages[st.pages.length-1].push(id));
  all.forEach(id => { if(!seen.has(id)){ st.pages[st.pages.length-1].push(id); seen.add(id); } });
  st.order = [].concat(...st.pages, st.dock);
  return st;
}

  state.order = [].concat(...state.pages, state.dock);

}
function esc(t){ return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function kbs(keys){
  return '<span class="kbs">' + keys.split(' ').filter(Boolean).map(k => `<span class="kb">${esc(k)}</span>`).join('') + '</span>';
}
function rowsHTML(items){
  return '<div class="group">' + items.map(([k,d]) => `<div class="row"><span class="d">${esc(d)}</span>${kbs(k)}</div>`).join('') + '</div>';
}

/* Kutucuk ve simge */
function metaOf(id){
  const a = state.apps.find(x => x.id === id);
  if(a) return {name:a.name, g:PAL50[a.color % PAL50.length], svg:GLYPHS[(a.glyph || 0) % GLYPHS.length][1]};
  if(META[id]){
    const ci = state.colors && state.colors[id];
    return Object.assign({}, META[id], ci != null ? {g: PAL50[ci]} : {});
  }
  return null;
}
function iconHTML(id){
  const m = metaOf(id);
  const a = state.apps.find(x => x.id === id);
  const pic = state.icons[id] || (a && a.icon);
  if(pic) return `<div class="ic"><img src="${pic}" alt=""></div>`;
  return `<div class="ic" style="--g1:${m.g[0]};--g2:${m.g[1]};--gc:${m.g[0]}"><svg viewBox="0 0 24 24" fill="#fff">${m.svg}</svg></div>`;
}
function tileEl(id, idx, inDock){
  const m = metaOf(id); if(!m) return null;
  const isApp = state.apps.some(a => a.id === id);
  const t = document.createElement('div');
  t.className = 'tile' + (inDock ? ' dock-t' : '');
  t.dataset.id = id;
  t.style.setProperty('--i', idx);
  t.innerHTML = (isApp ? `<div class="del" data-rm="${id}">×</div>` : '') + iconHTML(id) + `<div class="lbl">${esc(m.name)}</div>`;
  return t;
}
function dockShown(){ return !!state.iosLook && state.dockOn !== false; }
/* Dock açıksa dock uygulamaları yalnız dock'ta; kapalıysa eski yerlerine döner */
function reconcileDock(){
  const flat = [].concat(...state.pages);
  const base = flat.filter(id => !state.dock.includes(id));
  if(dockShown()){ state.pages = [base]; return; }
  const slots = state.dockSlot || {};
  const ins = state.dock.map(id => ({id, s: slots[id] != null ? slots[id] : base.length})).sort((a,b) => a.s - b.s);
  ins.forEach(({id, s}) => base.splice(Math.min(s, base.length), 0, id));
  state.pages = [base];
}
function renderHome(){
  reconcileDock();
  const pager = $('#pager');
  const keep = pager.scrollLeft;
  pager.innerHTML = '';
  state.pages.forEach((pg, pi) => {
    const page = document.createElement('div');

  if(dockShown()) state.dock.forEach((id, idx) => { const t = tileEl(id, idx, true); if(t) dk.appendChild(t); });
  updateDots();
  fitGlass();
}
function curPageIdx(){
  const p = $('#pager'); const w = p.clientWidth || 1;
  return Math.min(state.pages.length - 1, Math.max(0, Math.round(p.scrollLeft / w)));
}
function updateDots(){

  const idx = curPageIdx();

/* Ekran yığını */
function updateUnder(){
  stack.forEach((s,i) => {
    const top = i === stack.length - 1;
    s.classList.toggle('in', top);
    s.classList.toggle('under', !top);
  });
  home.classList.toggle('under', stack.length > 0);
  document.querySelector('.sbar').style.display = stack.length ? 'none' : '';
  if(stack.length) res.style.display = 'none';
}
function push(title, build){
  closePop();
  const el = document.createElement('section');
  el.className = 'screen';
  el.innerHTML = `<div class="snav"><button class="back">‹ Geri</button><div class="ttl">${esc(title)}</div><span></span></div><div class="body"></div>`;
  el.querySelector('.back').onclick = pop;
  $('#app').appendChild(el);
  stack.push(el);
  build(el.querySelector('.body'));
  attachSwipe(el);
  requestAnimationFrame(() => requestAnimationFrame(updateUnder));
}
function pop(){
  const el = stack.pop(); if(!el) return;
  if(el._onClose) el._onClose();
  el.classList.remove('in','under');
  setTimeout(() => el.remove(), 520 * animMul());
  updateUnder();
  const top = stack[stack.length-1];
  const ttl = top && top.querySelector('.ttl');
  if(ttl && ttl.textContent === 'Ayarlar') renderSettings(top.querySelector('.body'));
  if(ttl && ttl.textContent === 'Notlar') renderNotesList(top.querySelector('.body'));
}
function attachSwipe(el){
  let sx = null, dx = 0;
  el.addEventListener('pointerdown', e => {
    if(e.clientX > 28 || stack[stack.length-1] !== el) return;
    sx = e.clientX; el.setPointerCapture(e.pointerId); el.style.transition = 'none';
  });
  el.addEventListener('pointermove', e => {
    if(sx === null) return;
    dx = Math.max(0, e.clientX - sx);
    el.style.transform = `translateX(${dx}px)`;
  });
  const end = () => {
    if(sx === null) return;
    sx = null; el.style.transition = ''; el.style.transform = '';
    if(dx > 90) pop();
    dx = 0;
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

/* Fotoğraf yardımcıları */
function readImage(file, cb){
  const r = new FileReader();
  r.onload = () => { const img = new Image(); img.onload = () => cb(img); img.src = r.result; };
  r.readAsDataURL(file);
}
function compressWall(file, cb){
  readImage(file, img => {
    const k = Math.min(1, 1080 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    cb(c.toDataURL('image/jpeg', .8));
  });
}
function compressSquare(file, cb){
  readImage(file, img => {
    const c = document.createElement('canvas'); c.width = 256; c.height = 256;
    const s = Math.min(img.width, img.height);
    c.getContext('2d').drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, 256, 256);
    cb(c.toDataURL('image/png'));
  });
}
function hasIcon(id){
  const a = state.apps.find(x => x.id === id);
  return !!(a ? a.icon : state.icons[id]);
}
function setIcon(id, data){
  const a = state.apps.find(x => x.id === id);
  if(a) a.icon = data; else state.icons[id] = data;
}
function resetIcon(id){
  const a = state.apps.find(x => x.id === id);
  if(a) delete a.icon; else delete state.icons[id];
}

  paintAll();

}
/* Ayarlar içinde alt arama kutusu: ayar başlıklarını ve satırlarını bulur */
function ensureSettingsSearch(body){
  const screen = body.parentElement;
  body.classList.add('has-sbar');
  let bar = screen.querySelector('.sset-bar');
  if(!bar){
    bar = document.createElement('div');
    bar.className = 'sset-bar';
    bar.innerHTML = '<div class="ssres" style="display:none"></div><input type="search" placeholder="Ayarlarda ara" autocomplete="off" enterkeyhint="search">';
    screen.appendChild(bar);
    const inp = bar.querySelector('input'), box = bar.querySelector('.ssres');
    inp.addEventListener('input', () => {
      const v = inp.value.trim().toLowerCase();
      const b = bar._body;
      if(!v || !b){ box.style.display = 'none'; box.innerHTML = ''; return; }
      const hits = [];
      b.querySelectorAll('.sec, .lab span, .row .d, .pad button, .btn, .seg button').forEach(el => {
        const txt = el.textContent.trim();
        if(!txt || !txt.toLowerCase().includes(v)) return;
        let target = el;
        if(!el.classList.contains('sec')){
          let s = el.previousElementSibling; let g = el.closest('.group, .pad');
          target = (g && g.previousElementSibling && g.previousElementSibling.classList.contains('sec')) ? g.previousElementSibling : el;
        }
        if(!hits.some(h => h.target === target)) hits.push({txt, target});
      });
      box.innerHTML = hits.length
        ? hits.slice(0, 12).map((h, i) => `<button class="row rowbtn" data-i="${i}"><span class="d">${esc(h.txt)}</span></button>`).join('')
        : '<div class="empty" style="padding:.8rem;color:var(--sub);text-align:center;font-size:.9rem">Eşleşme yok</div>';
      box.style.display = 'block';
      box.querySelectorAll('[data-i]').forEach(btn => btn.onclick = () => {
        const h = hits[+btn.dataset.i];
        h.target.scrollIntoView({block:'start', behavior:'smooth'});
        box.style.display = 'none'; inp.blur();
      });
    });
  }
  bar._body = body;
}

/* Ana ekran: düzenleme modunda taşıma, değilse dokunma */
let cand = null, dragEl = null, target = null, sx0 = 0, sy0 = 0, dragged = false, lastX = 0, lastY = 0;
function nearest(x, y){
  let best = null, bd = 1e9;
  grid.querySelectorAll('.tile').forEach(t => {
    if(t === dragEl) return;
    const r = t.getBoundingClientRect();
    const d = Math.hypot(x - (r.left + r.width/2), y - (r.top + r.height/2));
    if(d < bd){ bd = d; best = t; }
  });
  return bd < 52 ? best : null;
}
grid.addEventListener('pointerdown', e => {
  if(e.target.closest('.del')) return;
  const t = e.target.closest('.tile'); if(!t) return;
  cand = t; sx0 = e.clientX; sy0 = e.clientY; dragged = false;
});
grid.addEventListener('pointermove', e => {
  lastX = e.clientX; lastY = e.clientY;
  if(!cand) return;
  if(!dragEl){
    if(!document.body.classList.contains('editing')) return;
    if(Math.hypot(e.clientX - sx0, e.clientY - sy0) < 6) return;
    dragEl = cand; dragged = true; dragEl.classList.add('drag');
    try { grid.setPointerCapture(e.pointerId); } catch(_){}
  }
  dragEl.style.transform = `translate(${e.clientX - sx0}px, ${e.clientY - sy0}px) scale(1.06)`;
  const nt = nearest(e.clientX, e.clientY);
  if(target && target !== nt) target.classList.remove('target');
  target = nt;
  if(nt) nt.classList.add('target');
});
function rememberSlot(id){
  const i = state.pages[0] ? state.pages[0].indexOf(id) : -1;
  state.dockSlot = state.dockSlot || {};
  state.dockSlot[id] = i >= 0 ? i : (state.pages[0] || []).length;
}
function layoutRemove(id){
  state.pages.forEach(pg => { const i = pg.indexOf(id); if(i >= 0) pg.splice(i, 1); });
  const d = state.dock.indexOf(id); if(d >= 0) state.dock.splice(d, 1);
}
function endPointer(){
  if(dragEl){
    const id = dragEl.dataset.id;
    if(target){
      const tid = target.dataset.id;
      const toDock = !!target.closest('#dock');
      const dockOthers = state.dock.filter(x => x !== id).length;
      if(!(toDock && dockOthers >= 4 && !state.dock.includes(tid))){
        if(toDock && !state.dock.includes(id)) rememberSlot(id);
        layoutRemove(id);
        if(toDock){
          const idx = state.dock.indexOf(tid);
          state.dock.splice(idx < 0 ? state.dock.length : idx, 0, id);
        } else {
          const pi = +target.closest('.grid').dataset.page;
          const arr = state.pages[pi];
          const idx = arr.indexOf(tid);
          arr.splice(idx < 0 ? arr.length : idx, 0, id);
        }
        save();
      }
    } else {
      const r = $('#dock').getBoundingClientRect();
      if(lastX >= r.left && lastX <= r.right && lastY >= r.top && lastY <= r.bottom && state.dock.filter(x => x !== id).length < 4){
        if(!state.dock.includes(id)) rememberSlot(id);
        layoutRemove(id); state.dock.push(id); save();
      }
    }
    dragEl.classList.remove('drag');
    dragEl = null; target = null;
    renderHome();
  }
  cand = null;
}
grid.addEventListener('pointerup', endPointer);
grid.addEventListener('pointercancel', endPointer);
grid.addEventListener('click', e => {
  const del = e.target.closest('.del');
  if(del){
    e.stopPropagation();
    const app = state.apps.find(x => x.id === del.dataset.rm);
    if(confirm(`"${app ? app.name : 'Bu kutucuk'}" kutucuğunu silmek istediğinden emin misin?`)) deleteApp(del.dataset.rm);
    return;
  }
  if(dragged){ dragged = false; return; }
  if(document.body.classList.contains('editing')) return;
  const t = e.target.closest('.tile');
  if(t) openScreen(t.dataset.id);
});

/* Arama ve yerel asistan (dış servis kullanmaz) */
function allItems(){
  const list = [];
  Object.values(SECTIONS).forEach(s => s.items.forEach(([k,d]) => list.push({k, d, src: s.name})));
  state.extras.forEach(x => list.push({k: x.keys, d: x.name + (x.desc ? ' ' + x.desc : ''), src: 'Ekstra'}));
  state.apps.forEach(a => a.items.forEach(x => list.push({k: x.keys, d: x.desc || a.name, src: a.name})));
  return list;
}
function answer(text){
  const words = text.toLowerCase().split(/\s+/).filter(Boolean);
  const aliasKeys = Object.keys(ALIAS).filter(a => words.some(w => w.startsWith(a)));
  const hits = [];
  allItems().forEach(it => {
    const hay = (it.d + ' ' + it.k + ' ' + it.src).toLowerCase();
    let score = 0;
    words.forEach(w => { if(hay.includes(w)) score += 2; });
    aliasKeys.forEach(a => { if(it.k.includes(ALIAS[a])) score += 3; });
    if(score > 0) hits.push({...it, score});
  });
  return hits.sort((a,b) => b.score - a.score).slice(0, 12);
}
q.addEventListener('input', () => {
  const v = q.value.trim();
  if(!v){ res.style.display = 'none'; return; }
  const hits = answer(v);
  res.style.display = 'block';
  res.innerHTML = hits.length
    ? '<div class="group" style="margin:0;border-radius:1rem">' + hits.map(h =>
        `<div class="row"><span class="d">${esc(h.d)}<small>${esc(h.src)}</small></span>${kbs(h.k)}</div>`).join('') + '</div>'
    : '<div class="empty">Eşleşme yok. "kopyala", "ekran", "sekme" gibi kısa kelimeler dene.</div>';
});
q.addEventListener('keydown', e => { if(e.key === 'Enter') q.blur(); });

$('#pdots').addEventListener('click', e => {

/* Klavye yüksekliğini ölç: biçimlendirme çubuğu klavyenin üstüne çıkar */
function syncKeyboard(){
  const vv = window.visualViewport;
  const kb = vv ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) : 0;
  document.documentElement.style.setProperty('--kb', kb + 'px');
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', syncKeyboard);
  window.visualViewport.addEventListener('scroll', syncKeyboard);
}

/* Başlangıç */
applySettings();
renderHome();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if((state.theme || 'sys') === 'sys') applySettings(); });
